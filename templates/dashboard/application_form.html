{% extends "base.html" %}
{% block title %}{{ 'Edit application' if application else 'Add application' }}{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{{ url_for('applications.index') }}">&larr; Applications</a>
</div>
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h4 mb-3">{{ 'Edit application' if application else 'Add application' }}</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" required maxlength="150"
               value="{{ name|default(application.name if application else '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="target_url">Target URL</label>
        <input class="form-control" id="target_url" name="target_url" type="url" required maxlength="2048"
               placeholder="https://example.com"
               value="{{ target_url|default(application.target_url if application else '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="4">{{ description|default(application.description if application and application.description else '') }}</textarea>
      </div>
      <button class="btn btn-primary" type="submit">{{ 'Save changes' if application else 'Add application' }}</button>
    </form>
  </div>
</div>
{% endblock %}
